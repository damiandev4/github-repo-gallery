<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Repo Gallery</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Oswald:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous" />

  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
  <script src="js/script.js" defer></script>

</head>

<body>
  <div class="badge">
    <div class="circle"></div>
  </div>

  <header>
    <h1><i class="fab fa-github-alt" aria-hidden="true"></i>GitHub Repo Gallery</h1>
  </header>

  <main> 
    <section class="user-info-display">  <!-- this is now just a wrapper -->
      <!-- <img src="img/avatar.jpg" alt="Avatar of Damián"> -->
      <div class="user-data">
      </div>
    </section>

    <section class="repos">
      <div class="search-container">
        <i class="fas fa-search" aria-hidden="true"></i>
        <label for="search" class="visually-hidden">Search repos</label>
        <input type="text" class="filter-repos" class="filter-repos" id="search"/>
      </div>
      <ul class="repo-list"></ul>
    </section>
    <section class="repo-data">
    </section>
    <div class="button-container">
      <button class="backToRepos hide">Back to Repo Gallery</button>
    </div>
  </main>
</body>

</html>
